name: Official SWE-bench assisted patch grading
on:
  push:
    branches: [experiment/local-agent-json-grade-03]
    paths: ['.github/workflows/local-agent-grade.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: qwen2.5-coder:3b
            artifact: assisted-0
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original generation artifacts without new inference
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          mkdir -p original
          gh run download 40011543481 --repo oigorbrito/local --name "$ARTIFACT_NAME" --dir original
      - name: Build exact prediction records
        env:
          MODEL: ${{ matrix.model }}
        run: python3 ci/build_predictions.py original "${MODEL//:/_}" predictions.jsonl
      - name: Install official SWE-bench evaluator
        run: |
          python3 -m pip install 'swebench==4.1.0'
          python3 -m pip show swebench
          python3 -m swebench.harness.run_evaluation --help >/dev/null
      - name: Environment storage gate
        run: |
          df -h . /var/lib/docker || true
          docker info --format '{{json .DriverStatus}}'
      - name: Grade original patches on SWE-bench Lite dev
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python3 -m swebench.harness.run_evaluation \
            --dataset_name princeton-nlp/SWE-bench_Lite \
            --split dev \
            --predictions_path predictions.jsonl \
            --max_workers 1 \
            --run_id "local-${{ github.run_id }}-${{ strategy.job-index }}"
      - name: Retain compact official results
        if: always()
        run: |
          mkdir -p portable-evidence
          find . -type f \( -name '*.json' -o -name '*.jsonl' \) -path '*evaluation*' -print | while IFS= read -r file; do
            dest="portable-evidence/$(printf '%s' "$file" | sha256sum | cut -c1-16).json"
            cp "$file" "$dest"
          done
          if test -f predictions.jsonl; then cp predictions.jsonl portable-evidence/predictions.jsonl; fi
      - name: Save grading evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-grade-${{ strategy.job-index }}
          path: portable-evidence/
          if-no-files-found: warn
          retention-days: 7
