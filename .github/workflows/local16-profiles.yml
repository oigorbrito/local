name: LOCAL-16 profile contracts
on:
  pull_request:
    paths:
      - 'experiments/local07/model_profiles.py'
      - 'experiments/local07/profile_cli.py'
      - 'experiments/local07/inspect_profiles.py'
      - 'experiments/local07/test_model_profiles.py'
      - 'experiments/local07/test_profile_runtime.py'
      - 'experiments/local07/ollama_adapter.py'
      - 'experiments/local07/local16_acceptance.py'
      - 'experiments/local07/test_local16_acceptance.py'
      - 'experiments/local07/local16_evidence_gate.py'
      - 'experiments/local07/test_local16_evidence_gate.py'
      - 'experiments/local07/reviewed_patch.py'
      - 'experiments/local07/test_reviewed_patch.py'
      - 'experiments/local07/local16_workflow.py'
      - 'experiments/local07/test_local16_workflow.py'
      - 'experiments/local07/local20_pipeline.py'
      - 'experiments/local07/test_local20_pipeline.py'
      - 'experiments/local07/test_local20_preregistered_case.py'
      - 'experiments/local07/run_local20_windows.ps1'
      - 'experiments/local07/cases/anchor-reasons-002.txt'
      - 'experiments/local07/local17_real_issue_trial.py'
      - 'experiments/local07/test_local17_real_issue_trial.py'
      - 'experiments/local07/local17_static_oracle.py'
      - 'experiments/local07/test_local17_static_oracle.py'
      - 'experiments/local07/static_patch_gate.py'
      - 'experiments/local07/fixture_functional_grade.py'
      - 'experiments/local07/windows_runtime_smoke.py'
      - 'docs/LOCAL-16-MODEL-PROFILES.md'
      - 'docs/LOCAL-16-WINDOWS-QUALIFICATION.md'
      - 'docs/LOCAL-17-REAL-ISSUE-TRIAL.md'
      - '.github/workflows/local16-profiles.yml'
  workflow_dispatch:
permissions: {}
jobs:
  profile-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse LOCAL-20 Windows launcher without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $file = Join-Path $PWD 'experiments/local07/run_local20_windows.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
      - name: Compile and test
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q experiments/local07
          cd experiments/local07
          python profile_cli.py --list
          python -m unittest -v test_model_profiles test_profile_runtime test_local16_acceptance test_local16_evidence_gate test_reviewed_patch test_local17_real_issue_trial test_local17_static_oracle test_local16_workflow test_executor_bridge test_ollama_adapter test_integrated_edit test_local20_pipeline test_local20_preregistered_case
      - name: Real pinned LOCAL-17 issue preparation (no inference)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import tempfile
          root = pathlib.Path.cwd()
          runner = root / "experiments" / "local07" / "local17_real_issue_trial.py"
          from pathlib import Path
          # Use an actual detached worktree at the preregistered commit,
          # rather than accepting a mocked Git history or a fabricated fixture.
          base = "a3e80e82788d798faa1a83b5a99762412cdaf61b"
          with tempfile.TemporaryDirectory(prefix="local17-real-git-") as tmp:
              worktree = Path(tmp) / "source"
              session = Path(tmp) / "session"
              subprocess.run(["git", "worktree", "add", "--detach", str(worktree), base],
                             cwd=root, check=True, stdout=subprocess.DEVNULL)
              try:
                  p = subprocess.run([sys.executable, str(runner),
                                      "--repo", str(worktree), "--session", str(session)],
                                     text=True, capture_output=True, timeout=75)
                  assert p.returncode == 0, p.stdout + p.stderr
                  report = json.loads(p.stdout)
                  assert report["status"] == "REAL_ISSUE_PREPARED"
                  assert report["inference_calls_attempted"] == 0
                  assert report["candidate_code_executed"] is False
                  assert report["retrieval_top_2_contains_target"] is True
                  assert report["real_issue_resolved"] == "NOT_EVALUATED"
                  assert (session / "session.json").is_file()
                  # Independent negative control from actual pinned Git blob.
                  sys.path.insert(0, str(root / "experiments" / "local07"))
                  from local17_static_oracle import assess_source
                  pinned = worktree / "experiments" / "local07" / "reviewed_patch.py"
                  original = pinned.read_text(encoding="utf-8")
                  control = assess_source(original, original)
                  assert control["status"] == "STATIC_BEHAVIOR_FAIL", control
                  assert control["passed"] == 3, control
                  assert control["cases"]["external_symlink_rejected"]["observed"] == "EXTERNAL_PATH"
              finally:
                  subprocess.run(["git", "worktree", "remove", "--force", str(worktree)],
                                 cwd=root, check=True, stdout=subprocess.DEVNULL)
          PY
      - name: Refuse unchecked inference policies
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/local07
          python -c "from model_profiles import PROFILES; assert all(p.version and len(p.fingerprint)==64 for p in PROFILES.values())"
